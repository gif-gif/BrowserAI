    <main>
      <article>
        <h1>浏览器中的 AI 助手</h1>
        <p>浏览器侧边栏让用户在不离开当前页面的情况下获得人工智能帮助。它可以读取文章正文，理解用户选择的文本，并围绕当前任务给出回答。</p>
        <p>一个可靠的实现需要清晰地区分系统指令、用户问题和网页数据。网页可能包含恶意提示，因此提取出的内容只能作为不可信参考资料。</p>
        <p>隐私保护同样重要。页面内容应该先在本地提取，只有用户主动发送问题后才能上传，而且密钥必须限制在扩展的可信上下文中。</p>
        <p>为了让长文章也能稳定工作，实现还需要规范化空白字符、限制上下文长度，并在发生截断时保留明确的元数据。</p>
      </article>
    </main>
