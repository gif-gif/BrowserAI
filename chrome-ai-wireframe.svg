<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1440" height="1024" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0F172A; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #334155; }
      .body { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #64748B; }
      .chip { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #334155; }
      .mono { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #64748B; }
    </style>
  </defs>

  <rect width="1440" height="1024" fill="url(#bg)"/>

  <!-- Browser chrome -->
  <g filter="url(#shadow)">
    <rect x="84" y="48" width="1272" height="928" rx="28" fill="#FFFFFF"/>
    <rect x="84" y="48" width="1272" height="68" rx="28" fill="#F8FAFC"/>
    <circle cx="120" cy="82" r="7" fill="#F87171"/>
    <circle cx="144" cy="82" r="7" fill="#FBBF24"/>
    <circle cx="168" cy="82" r="7" fill="#34D399"/>
    <rect x="236" y="64" width="586" height="36" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="260" y="87" class="mono">chrome://newtab  ·  Ask Gemini style prototype</text>
    <rect x="1096" y="66" width="124" height="32" rx="16" fill="#EEF2FF"/>
    <text x="1119" y="87" class="chip">Ask AI</text>
  </g>

  <!-- Main page area -->
  <rect x="112" y="136" width="770" height="808" rx="24" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="112" y="136" width="770" height="66" rx="24" fill="#F8FAFC"/>
  <text x="142" y="176" class="title">当前网页</text>
  <text x="142" y="194" class="small">文章 / 文档 / 搜索结果 · 作为默认上下文</text>

  <!-- page content lines -->
  <rect x="142" y="232" width="680" height="20" rx="10" fill="#E2E8F0"/>
  <rect x="142" y="266" width="612" height="20" rx="10" fill="#E2E8F0"/>
  <rect x="142" y="300" width="648" height="20" rx="10" fill="#E2E8F0"/>
  <rect x="142" y="348" width="700" height="128" rx="18" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="170" y="386" class="label">选区示例</text>
  <text x="170" y="414" class="body">用户拖选一段内容后，可直接浮现操作条：</text>
  <g>
    <rect x="170" y="432" width="76" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="188" y="452" class="chip">总结</text>
    <rect x="256" y="432" width="76" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="274" y="452" class="chip">翻译</text>
    <rect x="342" y="432" width="76" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="360" y="452" class="chip">解释</text>
    <rect x="428" y="432" width="90" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="445" y="452" class="chip">问 AI</text>
  </g>

  <rect x="142" y="510" width="660" height="18" rx="9" fill="#E2E8F0"/>
  <rect x="142" y="542" width="720" height="18" rx="9" fill="#E2E8F0"/>
  <rect x="142" y="574" width="598" height="18" rx="9" fill="#E2E8F0"/>
  <rect x="142" y="620" width="700" height="174" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="170" y="656" class="label">浮动上下文卡片</text>
  <text x="170" y="684" class="body">当前页 · 选中文本 1 段 · 截图 1 张 · 标签页 2 个</text>
  <rect x="170" y="706" width="120" height="32" rx="16" fill="#DBEAFE"/>
  <text x="196" y="727" class="chip">当前页</text>
  <rect x="300" y="706" width="146" height="32" rx="16" fill="#E0E7FF"/>
  <text x="324" y="727" class="chip">选中文本</text>
  <rect x="456" y="706" width="104" height="32" rx="16" fill="#DCFCE7"/>
  <text x="480" y="727" class="chip">截图</text>
  <rect x="570" y="706" width="118" height="32" rx="16" fill="#FFE4E6"/>
  <text x="591" y="727" class="chip">标签页</text>

  <rect x="142" y="820" width="700" height="84" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="170" y="852" class="label">快捷入口</text>
  <text x="170" y="878" class="body">总结当前页 · 翻译选区 · 解释术语 · 生成回复</text>

  <!-- Side panel -->
  <rect x="906" y="136" width="420" height="808" rx="24" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="906" y="136" width="420" height="66" rx="24" fill="#F8FAFC"/>
  <text x="936" y="176" class="title">Ask AI</text>
  <text x="1080" y="176" class="small">Gemini-style side panel</text>

  <!-- top actions -->
  <rect x="936" y="220" width="78" height="28" rx="14" fill="#EEF2FF"/>
  <text x="954" y="239" class="chip">当前页</text>
  <rect x="1022" y="220" width="94" height="28" rx="14" fill="#EEF2FF"/>
  <text x="1037" y="239" class="chip">选中文本</text>
  <rect x="1124" y="220" width="74" height="28" rx="14" fill="#EEF2FF"/>
  <text x="1140" y="239" class="chip">截图</text>
  <rect x="1206" y="220" width="96" height="28" rx="14" fill="#EEF2FF"/>
  <text x="1222" y="239" class="chip">历史</text>

  <!-- chat messages -->
  <rect x="936" y="272" width="336" height="84" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="956" y="302" class="label">用户</text>
  <text x="956" y="327" class="body">帮我总结这篇文章的核心观点。</text>

  <rect x="936" y="372" width="336" height="160" rx="18" fill="#ECFDF5" stroke="#BBF7D0"/>
  <text x="956" y="402" class="label">AI</text>
  <text x="956" y="430" class="body">1. 先给结论摘要</text>
  <text x="956" y="456" class="body">2. 再给 3-5 个要点</text>
  <text x="956" y="482" class="body">3. 最后提供可继续追问的建议</text>
  <text x="956" y="508" class="body">支持 markdown、代码块、引用高亮。</text>

  <rect x="936" y="548" width="336" height="112" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="956" y="578" class="label">推荐操作</text>
  <g>
    <rect x="956" y="596" width="68" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="974" y="616" class="chip">复制</text>
    <rect x="1032" y="596" width="92" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="1048" y="616" class="chip">继续问</text>
    <rect x="1132" y="596" width="84" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="1147" y="616" class="chip">重生成</text>
  </g>

  <!-- input area -->
  <rect x="936" y="678" width="336" height="198" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="956" y="700" width="296" height="88" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="976" y="730" class="small">问任何关于当前页面的问题…</text>
  <text x="976" y="754" class="small">支持多轮对话、流式输出、附件上下文。</text>
  <rect x="956" y="802" width="72" height="32" rx="16" fill="#DBEAFE"/>
  <text x="976" y="823" class="chip">页</text>
  <rect x="1036" y="802" width="72" height="32" rx="16" fill="#E0E7FF"/>
  <text x="1052" y="823" class="chip">图</text>
  <rect x="1116" y="802" width="72" height="32" rx="16" fill="#DCFCE7"/>
  <text x="1132" y="823" class="chip">文</text>
  <rect x="1200" y="798" width="52" height="40" rx="20" fill="#4F46E5"/>
  <path d="M1219 810 L1235 818 L1219 826 Z" fill="#FFFFFF"/>
</svg>
